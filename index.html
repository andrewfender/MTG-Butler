<!DOCTYPE html>
<html>

<HEAD>

<title>MTG Butler | Scryfall Sorter</title>
<script type="text/javascript" src="js/scryfall-sorter.js"></script>
<link rel="stylesheet" href="css/style_general.css"/>
<link rel="stylesheet" href="css/style_scryfall-sorter.css"/>

</HEAD>



<BODY>
<div id="page-wrapper">

<div id="search">
  Enter a <a href="https://scryfall.com/docs/syntax" target="_blank">Scryfall search term</a>. Results will be grouped by set (most recent first) and ordered by EDHREC rank.<br/><br/>
  <form><input id="search-box" type="text" placeholder="ci=boros t:creature cmc>5"/> <button id="search-button">Search</button></form>
  <span class="small-text">The "order:" search parameter will be ignored. Digital-only cards will not be displayed. Cards not legal in commander (e.g. silver border) WILL be displayed.</span>
</div>
<hr>
<div id="search-error"></div>
<div id="results-bar"><span id="results-counter">Results: 0</span> <span id="loading-spinner"></span></div>

<div id="pager-top" class="pager"></div>

<div id="card-list">
</div>

<div id="pager-bottom" class="pager"></div>

</div>
</BODY>

</html>
