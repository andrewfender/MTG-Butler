<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTG Butler | Scryfall Sorter</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/scryfall-sorter.js" defer></script>
</head>
<body>
<div id="page-wrapper">

Enter a <a href="https://scryfall.com/docs/syntax" target="_blank">Scryfall search term</a>. Results will be grouped by set (most recent first) and ordered by EDHREC rank.<br>
<span class="small-text">The "order:" search parameter will be ignored. Digital-only cards will not be displayed. Cards not legal in commander (e.g. silver border) WILL be displayed.</span>

<form id="search-form"><input id="search-box" type="text" placeholder="ci=boros t:creature cmc>5"> <button>Search</button></form>
<div id="search-error"></div>
<div id="results-bar"><span id="results-counter">Results: 0</span> <span id="loading-spinner"></span></div>

<div id="card-list"></div>

<p><button id="load-more" type="button" hidden>Load more</button></p>

</div>
</body>
</html>
